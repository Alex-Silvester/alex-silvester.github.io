<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8"/>
    <title>About me</title>

    <link rel="stylesheet" href="../styles.css" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="../scripts/darkmode_button.js"></script>

    <script>
        $(document).ready(function () {
            $('#home_button').click(function () {
                window.location.href="../index.html"
            });
        });
    </script>

    <script>
        $(document).ready(function () {

            $.get("../Text/about_me.txt", function (data) {
                $("p#aboutMeText").text(data.replace(
                    "<exp>", (new Date().getFullYear()-2018).toString()));
            });

        }
        );
    </script>
</head>

<body>

    <div class="header_bar">
        <button id="darkmode_button" type="button" class="header_switch">
            <img src="../images/crescent_moon_trans.png" style="width:100%;height:100%;">
        </button>
        <button id="home_button" type="button" class="header_switch" style="top:0px;right: 0px;">
            <div>Home</div>
        </button>
    </div>

    <div style="display: flex;">
        <div style="width:50%">
            <h2 style="justify-self: center;">About me</h2>
            <div class="centered">
                <hr class="separator", style="width:70%"/>
            </div>
            <p style="justify-self: center;text-align: center; max-width: 500px;" id="aboutMeText"></p>
        </div>
        <div style="width:50%; max-height: 500px; aspect-ratio: 3/4;float:right;">
            <img style="display: block; margin-left: auto; margin-right: auto; min-width:50%" src="../images/pre-graduation-photo.jpg"/>
        </div>
    </div>

    <div class="block"></div>

     <script src="../scripts/persistent_darkmode.js"></script>

</body>

</html>
