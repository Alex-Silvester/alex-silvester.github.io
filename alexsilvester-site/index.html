<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Alex Silvester</title>

    <link rel="stylesheet" href="styles.css" /> 

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>

    <script type="text/javascript">
        $( document ).ready(function() {

            $.get( "intro_text.txt", function( data ) {

              $( "#intro" ).html( data );

            });

        });
    </script>


</head>

<body>

    <div class="header_bar">
        <button type="button" class="header_switch" onclick="darkMode()">
            <img src="images/crescent_moon_trans.png" style="width:100%;height:100%;">
        </button>
    </div>

    <h1 class="header">Alex Silvester: Game Developer</h1>

    <div class="centered">
        <p id="intro"></p>
    </div>


    <div style="position : fixed; z-index : 10;">
        <div>
            <a href="https://www.linkedin.com/in/-alex-silvester">
                <img class="img-link" src="images/linkedin.png" alt="LinkedIn Logo">
            </a>
        </div>
    
        <div>
            <a href="https://github.com/Alex-Silvester">
                <img class="img-link" src="images/github.jpg" alt="GitHub Logo">
            </a>
        </div> 
    </div>


    <div style="height : 2000px;"></div>

</body>

<script>
    function darkMode() {

        let col = '#010120';

        if (document.body.style.backgroundColor == 'black')
        {
            document.body.style.backgroundColor = 'blanchedalmond';
            document.body.style.color = 'black';
        }
        else
        {
            document.body.style.backgroundColor = 'black';
            document.body.style.color = 'lightgrey';
        }
    }
</script>

</html>
