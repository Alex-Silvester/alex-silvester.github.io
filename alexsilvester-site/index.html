<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Alex Silvester</title>

    <link rel="stylesheet" href="styles.css" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="scripts.js"></script>

    <script>
        $(document).ready(function () {
            $('#darkmode_button').click(function () {
                document.body.classList.toggle('darkmode');

                if ($(".separator").hasClass("separator_darkmode")) {
                    $(".separator").removeClass("separator_darkmode");
                }
                else {
                    $(".separator").addClass("separator_darkmode");
                }

                if ($(".block").hasClass("block_darkmode")) {
                    $(".block").removeClass("block_darkmode");
                }
                else {
                    $(".block").addClass("block_darkmode");
                }
            });
        });
    </script>


</head>

<body>

    <div class="header_bar">
        <button id="darkmode_button" type="button" class="header_switch" onclick="darkMode()">
            <img src="images/crescent_moon_trans.png" style="width:100%;height:100%;">
        </button>
    </div>

    <h1 class="header">Alex Silvester: Game Developer</h1>

    <div style="width:60%; justify-self:center;">
        <hr class="separator"/>
    </div>

    <div class="centered">

    <div style="width:80%; justify-self:center;">

    </div>

    <div class="block">

                <hr class="separator" />
            </div>

        </div>
        <div class="block_content">

        </div>
    </div>

    <div style="position : fixed; top : 40%;">
        <div>
            <a href="https://www.linkedin.com/in/-alex-silvester">
                <img class="img-link" src="images/linkedin.png" alt="LinkedIn Logo">
            </a>
        </div>
    
        <div>
            <a href="https://github.com/Alex-Silvester">
                <img class="img-link" src="images/github.jpg" alt="GitHub Logo">
            </a>
        </div> 
    </div>

</body>

</html>
