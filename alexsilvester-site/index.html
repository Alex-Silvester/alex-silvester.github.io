<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8"/>
    <title>Alex Silvester</title>

    <link rel="stylesheet" href="styles.css" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        $(document).ready(function () {

            $.get("Text/intro_text.txt", function (data) {
                $("p#intro").text(data.replace(
                    "<exp>", (new Date().getFullYear()-2018).toString()));
            });

        }
        );
    </script>

    <script>
        $(document).ready(function () {

            $.get("Text/Renderer_text.txt", function (data) {
                $("p#RendererText").text(data);
            });

        }
        );
    </script>

    <script>
        $(document).ready(function () {

            $.get("Text/SO_text.txt", function (data) {
                $("p#SafetyOptionalText").text(data);
            });

        }
        ); 
    </script>

    <script>
        $(document).ready(function () {
            $('#darkmode_button').click(function () {
                document.body.classList.toggle('darkmode');

                if ($(".separator").hasClass("separator_darkmode")) {
                    $(".separator").removeClass("separator_darkmode");
                }
                else {
                    $(".separator").addClass("separator_darkmode");
                }

                if ($(".block").hasClass("block_darkmode")) {
                    $(".block").removeClass("block_darkmode");
                }
                else {
                    $(".block").addClass("block_darkmode");
                }
            });
        });
    </script>

    <script>
        $(document).ready(function () {
            $('#about_me_button').click(function () {
                window.location.href="Pages/Personal.html"
            });
        });
    </script>


</head>

<body>

    <div class="header_bar">
        <button id="darkmode_button" type="button" class="header_switch">
            <img src="images/crescent_moon_trans.png" style="width:100%;height:100%;">
        </button>
        <button id="about_me_button" type="button" class="header_switch" style="top:0px;right: 0px;">
            <div>About me</div>
        </button>
    </div>

    <h1 class="header">Alex Silvester: Game Developer</h1>

    <div class="centered">
        <hr class="separator", style="width:70%"/>
    </div>

    <div class="centered">
        <p id="intro", style="margin-left:10%;margin-right:10%"></p>
    </div>

    <div class="block">
        <div class="block_text">
            <h3>3D Renderer</h3>
            <hr class="separator" style="width:70%;"/>
            <p id="RendererText"></p>
        </div>
        <div class="block_image">
            <a href="https://github.com/Alex-Silvester/3D-Rendering-Library">
                <img src="images/Renderer3D.png">   
            </a>
        </div>  
    </div>

    <div class="block">
        <div class="block_image">
            <a href="https://github.com/Alex-Silvester/CGD-Project">
                <img src="images/SafetyOptional.png">    
            </a>
        </div>
        <div class="block_text">
            <h3>Safety Optional</h3>
            <hr class="separator" style="width:70%;"/>
            <p id="SafetyOptionalText"></p>
        </div>  
    </div>



    <div style="position : fixed; top : 40%;">
        <div>
            <a href="https://www.linkedin.com/in/-alex-silvester">
                <img class="img-link" src="images/linkedin.png" alt="LinkedIn Logo">
            </a>
        </div>
    
        <div>
            <a href="https://github.com/Alex-Silvester">
                <img class="img-link" src="images/github.jpg" alt="GitHub Logo">
            </a>
        </div> 
    </div>

</body>

</html>
